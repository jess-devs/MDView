[package]
name = "mdview"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "=0.2.2"
gpui-component = { version = "=0.5.1", default-features = false }
open = "5.4.2"
pulldown-cmark = "0.13.4"

# RF-03.1's single-instance mechanism (AD-28) is Win32-specific by design;
# gated here so a Linux build (feature `multiplataforma`) never tries to
# compile it. `app.rs` mirrors the same gate around every call site.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
